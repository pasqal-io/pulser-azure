name: Pull Request Labeler

on:
  pull_request_target:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6

  require-label:
    needs: label
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/labels.yml
          sparse-checkout-cone-mode: false

      - name: Require a known label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          allowed=$(yq -r '.[].name' .github/labels.yml | sort)
          pr_labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | sort)

          if [ -z "$pr_labels" ]; then
            echo "::error::This PR has no labels. Add one of: $(echo "$allowed" | paste -sd ', ' -)"
            exit 1
          fi

          unknown=$(comm -23 <(echo "$pr_labels") <(echo "$allowed"))
          if [ -n "$unknown" ]; then
            echo "::error::PR has labels not declared in .github/labels.yml: $(echo "$unknown" | paste -sd ', ' -)"
            echo "::error::Allowed: $(echo "$allowed" | paste -sd ', ' -)"
            exit 1
          fi

          echo "PR labels OK: $(echo "$pr_labels" | paste -sd ', ' -)"
