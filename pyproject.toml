[project]
name = "pulser-azure"
version = "0.1.0"
description = "A Pulser-compatible package to connect to Azure Pasqal Cloud Services"
readme = "README.md"
authors = [{ name = "Alexandre Papin", email = "alexandre.papin@pasqal.com" }]
requires-python = ">=3.10"
dependencies = [
    "azure-quantum>=3.8.0",
    "pulser-core>=1.7.2",
    "urllib3>=2.6.3",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.pytest.ini_options]
addopts = "-x"

[tool.ty.src]
exclude = ["**/*.ipynb"]
