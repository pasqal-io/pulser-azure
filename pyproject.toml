[project]
name = "pulser-azure"
dynamic = ["version"]
description = "A Pulser-compatible package to connect to Azure Pasqal Cloud Services"
readme = "README.md"
authors = [{ name = "Alexandre Papin", email = "alexandre.papin@pasqal.com" }]
requires-python = ">=3.10"
dependencies = [
    "azure-quantum>=3.9.1",
    "pasqal-cloud>=0.23.0",
    "pulser-core>=1.8.0",
    "urllib3>=2.6.3",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/pulser_azure/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pulser_azure"]

[dependency-groups]
dev = ["pre-commit>=4.0.0", "pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.33"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]

[tool.pytest.ini_options]
addopts = "-x"

[tool.ty.src]
exclude = ["**/*.ipynb"]
